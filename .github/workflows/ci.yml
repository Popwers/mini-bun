name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the running build useless. Main runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    # Normal run is about 1 min (p90 1.5). Without a timeout a hang bills up to 6 h.
    timeout-minutes: 10
    if: ${{ !startsWith(github.event.head_commit.message, '🚀 Update') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mini-bun:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          EXPECTED=$(grep 'ARG BUN_VERSION=' Dockerfile | cut -d'=' -f2 | sed 's/^v//')
          ./scripts/smoke-test.sh mini-bun:ci-test "$EXPECTED"

      - name: Check docs against image
        run: ./scripts/bump-versions.sh check-docs mini-bun:ci-test
