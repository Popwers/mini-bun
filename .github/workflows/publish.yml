name: Docker Hub Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  check_and_update_bun_version:
    name: Check and Update Bun Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check_version.outputs.new_version }}
      latest_version: ${{ steps.check_version.outputs.latest_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest Bun version
        id: check_version
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/oven-sh/bun/releases/latest | jq -r .tag_name | sed 's/^bun-//')
          CURRENT_VERSION=$(grep 'ARG BUN_VERSION=' Dockerfile | cut -d'=' -f2)
          echo "Latest version: $LATEST_VERSION"
          echo "Current version: $CURRENT_VERSION"
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "new_version=true" >> $GITHUB_OUTPUT
          else
            echo "new_version=false" >> $GITHUB_OUTPUT
          fi
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Verify required release artifacts exist
        if: steps.check_version.outputs.new_version == 'true'
        run: |
          # The image targets musl (x64 + arm64). Abort the bump if upstream
          # stops shipping one of these builds (e.g. Rust rewrite gaps) so we
          # never push a broken image. See: Bun Rust rewrite is Linux x64
          # glibc only as of v1.3.14.
          VERSION="${{ steps.check_version.outputs.latest_version }}"
          BASE="https://github.com/oven-sh/bun/releases/download/bun-${VERSION}"
          for arch in x64-musl-baseline aarch64-musl; do
            URL="${BASE}/bun-linux-${arch}.zip"
            echo "Checking ${URL}"
            if ! curl -fsI "${URL}" > /dev/null; then
              echo "::error::Missing required artifact bun-linux-${arch}.zip for ${VERSION} — refusing to bump."
              exit 1
            fi
          done
          echo "All required musl artifacts present for ${VERSION}."

      - name: Update Dockerfile
        if: steps.check_version.outputs.new_version == 'true'
        run: |
          sed -i 's/ARG BUN_VERSION=.*/ARG BUN_VERSION=${{ steps.check_version.outputs.latest_version }}/' Dockerfile

      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          author_name: Popwers
          author_email: lionel.bataille@hotmail.com
          message: '🚀 Update Bun version to ${{ steps.check_version.outputs.latest_version }}'

  docker:
    name: Release to Dockerhub
    needs: check_and_update_bun_version
    if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Docker emulator
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build amd64 for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          ./scripts/smoke-test.sh mini-bun:smoke-amd64 "$EXPECTED"

      - name: Build arm64 for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arm64 (minimal — runs under QEMU)
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          VERSION=$(docker run --rm --platform linux/arm64 mini-bun:smoke-arm64 --version)
          echo "arm64 reports: $VERSION"
          [ "$VERSION" = "$EXPECTED" ]

      - name: Build and push to Docker
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            popwers/mini-bun:latest
            popwers/mini-bun:${{ needs.check_and_update_bun_version.outputs.latest_version }}
