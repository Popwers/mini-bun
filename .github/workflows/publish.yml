name: Docker Hub Deployment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  check_and_update_bun_version:
    name: Check image pins
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check_version.outputs.new_version }}
      latest_version: ${{ steps.check_version.outputs.latest_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check image pins
        id: check_version
        run: ./scripts/bump-versions.sh check

  docker:
    name: Release to Dockerhub
    needs: check_and_update_bun_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply image pins
        run: ./scripts/bump-versions.sh apply

      - name: Setup Docker emulator
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test amd64
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          ./scripts/smoke-test.sh mini-bun:smoke-amd64 "$EXPECTED"

      - name: Sync Dockerfile pins and docs
        id: sync
        run: ./scripts/bump-versions.sh sync-docs mini-bun:smoke-amd64

      - name: Commit Dockerfile and docs
        uses: EndBug/add-and-commit@v9.1.3
        with:
          author_name: Popwers
          author_email: lionel.bataille@hotmail.com
          add: 'Dockerfile README.MD CLAUDE.md'
          message: ${{ steps.sync.outputs.commit_message }}

      - name: Build arm64 for testing
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          tags: mini-bun:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test arm64 (minimal — runs under QEMU)
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          EXPECTED="${LATEST_VERSION#v}"
          VERSION=$(docker run --rm --platform linux/arm64 mini-bun:smoke-arm64 --version)
          echo "arm64 reports: $VERSION"
          [ "$VERSION" = "$EXPECTED" ]

      - name: Compute minor version alias
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        id: minor
        env:
          LATEST_VERSION: ${{ needs.check_and_update_bun_version.outputs.latest_version }}
        run: |
          MINOR=$(echo "$LATEST_VERSION" | sed 's/^v//; s/\.[0-9]*$//')
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Build and push to Docker
        if: ${{ needs.check_and_update_bun_version.outputs.new_version == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUN_VERSION=${{ needs.check_and_update_bun_version.outputs.latest_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          tags: |
            popwers/mini-bun:latest
            popwers/mini-bun:${{ needs.check_and_update_bun_version.outputs.latest_version }}
            popwers/mini-bun:${{ steps.minor.outputs.minor }}
            ghcr.io/popwers/mini-bun:latest
            ghcr.io/popwers/mini-bun:${{ needs.check_and_update_bun_version.outputs.latest_version }}
            ghcr.io/popwers/mini-bun:${{ steps.minor.outputs.minor }}
